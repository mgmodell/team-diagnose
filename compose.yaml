services:
  db:
    image: postgres
    restart: always
    ports:
      - 5432:5432
    environment: 
      POSTGRES_USER: root
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: local
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d local"]
      interval: 5s
      timeout: 5s
      retries: 10
  node:
    image: node:26-bookworm
    working_dir: /workspaces/team-diagnose
    command: sleep infinity
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
